# Trả 404 THẬT cho các đường dẫn chắc chắn không thuộc ứng dụng.
#
# Vì sao cần: `location /` dùng `try_files $uri $uri/ /index.html`, nên MỌI URL đều trả 200 kèm
# trang có form đăng nhập — kể cả `/wp-login.php` hay `/paypal-verify`. Với trình thu thập của
# Safe Browsing, một host mà đường dẫn bịa nào cũng "tồn tại" và cũng hỏi email + mật khẩu là đặc
# điểm của bộ công cụ lừa đảo. Tên miền này đã bị Google xếp vào nhóm "social engineering"
# (2026-09-26), nên đây là thứ phải loại trừ trước khi xin gỡ cờ.
#
# Snippet này được include vào CẢ nginx.conf (production) lẫn nginx.dev.conf (local) để hai bên
# không lệch nhau — sửa một chỗ là xong.
#
# Lưu ý thứ tự khớp của nginx: location dạng biểu thức chính quy được xét TRƯỚC prefix `location /`
# thường, nên các quy tắc dưới đây thắng fallback SPA mà không cần chỉnh gì thêm.
#
# Cẩn thận khi thêm phần mở rộng mới: không được đụng tới thứ Vite thật sự sinh ra
# (.js .css .svg .json .woff2 .map) hay 3 file tĩnh trong frontend/public/.

# Phần mở rộng không bao giờ thuộc về một SPA build bằng Vite. Gồm cả các đuôi lộ dữ liệu nhạy cảm
# (.env, .sql, .bak) mà bot quét hàng loạt để tìm cấu hình bị bỏ quên.
location ~* \.(php|phtml|php\d|asp|aspx|jsp|cgi|pl|sh|bash|env|ini|conf|sql|bak|old|swp|log|zip|tar|gz|rar|7z|exe|dll)$ {
    return 404;
}

# Đường dẫn thuộc các mã nguồn khác mà bot dò liên tục (WordPress, phpMyAdmin...).
location ~* ^/(wp-admin|wp-content|wp-includes|wp-login|wordpress|xmlrpc|phpmyadmin|pma|cgi-bin|vendor|backup|shell)(/|$) {
    return 404;
}

# Mọi đường dẫn ẩn: /.env, /.git/config, /.aws/credentials...
# Chừa /.well-known vì Let's Encrypt dùng nó để xác thực domain lúc gia hạn chứng chỉ.
location ~ ^/\.(?!well-known) {
    return 404;
}
