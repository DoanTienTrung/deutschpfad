name: Build and Deploy

on:
  push:
    branches: [main]

env:
  BACKEND_IMAGE: ghcr.io/doantientrung/deutschpfad-backend
  FRONTEND_IMAGE: ghcr.io/doantientrung/deutschpfad-frontend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          # Empty VITE_API_ORIGIN -- production frontend calls the API via relative /api paths,
          # proxied through nginx to the backend container, not a separate origin (see nginx.conf).
          build-args: |
            VITE_API_ORIGIN=
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/deutschpfad
            git pull
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            # --build: browser-session has no registry image (built from its Dockerfile locally,
            # see docker-compose.prod.yml) -- without this flag, `up -d` reuses whatever image was
            # built the first time and silently ignores later Dockerfile/package.json changes.
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
