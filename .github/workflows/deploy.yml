name: Test

# Production chạy trên Render (render.yaml): Render tự build Dockerfile.render và deploy khi các job dưới
# đây xanh (autoDeployTrigger: checksPass), nên workflow này chỉ còn chạy test. Không còn build image lên
# GHCR hay SSH vào máy chủ. Cách chạy trên máy chủ tự quản (docker-compose.prod.yml, nginx HTTPS, deploy qua
# SSH, hướng dẫn ops/server-setup.md) đã xoá; cần lại thì lấy từ lịch sử git (commit f9ea675).

on:
  push:
    branches: [main]

jobs:
  # Chạy toàn bộ test backend TRƯỚC khi build bất kỳ image nào. Trước đây pipeline không có bước
  # test (Dockerfile build bằng -DskipTests) nên code hỏng vẫn được deploy thẳng lên production.
  #
  # -DskipTests trong Dockerfile vẫn giữ nguyên, và đó là cách làm đúng: test cần Postgres thật
  # (Testcontainers) nên không chạy được bên trong `docker build`. Chỗ thiếu là một job test riêng
  # ở đây — không phải bỏ -DskipTests.
  test-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers tự dựng Postgres (image pgvector) trong Docker — runner ubuntu-latest của
      # GitHub có sẵn Docker. Test không cần secret nào: profile "test" dùng giá trị giả, xem
      # backend/src/test/resources/application-test.yaml.
      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B test

  # Test frontend (vitest). Hiện kiểm phần chấm đáp án từ vựng — Umlaut, định dạng từ điển của dữ
  # liệu giáo trình, gợi ý mạo từ. Chưa chạy `lint` ở đây: còn 11 lỗi eslint có sẵn ở module
  # nghe/đọc/nói, thêm vào là chặn mọi lần deploy (xem docs/phase-1-auth.md, mục "Còn nợ").
  test-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
