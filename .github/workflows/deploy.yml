name: Build and Deploy

on:
  push:
    branches: [main]

env:
  BACKEND_IMAGE: ghcr.io/doantientrung/deutschpfad-backend
  FRONTEND_IMAGE: ghcr.io/doantientrung/deutschpfad-frontend

jobs:
  # Chạy toàn bộ test backend TRƯỚC khi build bất kỳ image nào. Trước đây pipeline không có bước
  # test (Dockerfile build bằng -DskipTests) nên code hỏng vẫn được deploy thẳng lên production.
  #
  # -DskipTests trong Dockerfile vẫn giữ nguyên, và đó là cách làm đúng: test cần Postgres thật
  # (Testcontainers) nên không chạy được bên trong `docker build`. Chỗ thiếu là một job test riêng
  # ở đây — không phải bỏ -DskipTests.
  test-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers tự dựng Postgres (image pgvector) trong Docker — runner ubuntu-latest của
      # GitHub có sẵn Docker. Test không cần secret nào: profile "test" dùng giá trị giả, xem
      # backend/src/test/resources/application-test.yaml.
      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B test

  build-backend:
    # Không build (và không đẩy image :latest lên GHCR) khi test đỏ.
    needs: test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  build-frontend:
    # Cũng chờ test backend: nếu không, test đỏ thì backend bị chặn nhưng frontend vẫn đẩy image
    # :latest lên GHCR — lần pull kế tiếp trên server sẽ lấy về một frontend không khớp backend.
    # (Frontend có sẵn lớp chặn riêng: `npm run build` chạy `tsc -b` bên trong Docker build.)
    needs: test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          # Empty VITE_API_ORIGIN -- production frontend calls the API via relative /api paths,
          # proxied through nginx to the backend container, not a separate origin (see nginx.conf).
          build-args: |
            VITE_API_ORIGIN=
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/deutschpfad
            git pull
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            # --build: browser-session has no registry image (built from its Dockerfile locally,
            # see docker-compose.prod.yml) -- without this flag, `up -d` reuses whatever image was
            # built the first time and silently ignores later Dockerfile/package.json changes.
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
