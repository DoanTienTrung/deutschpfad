spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:deutschpfad}
    username: ${DB_USERNAME:deutschpfad}
    password: ${DB_PASSWORD:deutschpfad}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  mail-from: ${MAIL_FROM:no-reply@deutschpfad.local}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  deepgram-api-key: ${DEEPGRAM_API_KEY:}
  groq-api-key: ${GROQ_API_KEY:}
  gemini-api-key: ${GEMINI_API_KEY:}
  unsplash-api-key: ${UNSPLASH_API_KEY:}
  openrouter-api-key: ${OPENROUTER_API_KEY:}
  cohere-api-key: ${COHERE_API_KEY:}
  # Base URL of the bgutil-ytdlp-pot-provider HTTP server (PO token generator) used to work
  # around YouTube's "Sign in to confirm you're not a bot" block on datacenter IPs (e.g. EC2).
  # Empty on local dev — home IPs aren't flagged, so yt-dlp works without it.
  ytdlp-pot-base-url: ${YTDLP_POT_BASE_URL:}
  # Path to a Netscape-format cookies.txt (exported from a real logged-in browser session) that
  # yt-dlp uses to look like an authenticated user instead of anonymous datacenter traffic — as
  # of 2026, YouTube's bot check on EC2 IPs no longer yields to a PO token alone. Fallback only
  # (see ytdlp-browser-profile-dir below, which is tried first): a frozen export like this goes
  # stale within hours as Google rotates the session, since nothing here keeps it moving.
  ytdlp-cookies-file: ${YTDLP_COOKIES_FILE:}
  # Directory of a persistent Chromium profile kept logged in by the browser-session service
  # (docker-compose.prod.yml) — yt-dlp reads its cookies live via --cookies-from-browser. This
  # is the primary mechanism: because a real (headless) browser is what's rotating them, they
  # stay valid the way a person's browser cookies would, instead of drifting out of sync like a
  # one-time file export. See YtDlpHealthCheckService for the daily check that alerts by email
  # if neither this nor the cookies-file fallback above is working.
  ytdlp-browser-profile-dir: ${YTDLP_BROWSER_PROFILE_DIR:}
  # Where the daily yt-dlp health check (YtDlpHealthCheckService) sends an alert email if the
  # cookies file above has gone stale. Defaults to mail-from so it's never silently unset.
  ytdlp-healthcheck-alert-email: ${YTDLP_HEALTHCHECK_ALERT_EMAIL:${MAIL_FROM:no-reply@deutschpfad.local}}
  tutor:
    onnx-model-path: ${TUTOR_ONNX_MODEL_PATH:models-scratch/model.onnx}
    onnx-tokenizer-path: ${TUTOR_ONNX_TOKENIZER_PATH:models-scratch/tokenizer.json}
    chunk-size: ${TUTOR_CHUNK_SIZE:800}
    chunk-overlap: ${TUTOR_CHUNK_OVERLAP:100}



