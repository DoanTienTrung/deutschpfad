spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:deutschpfad}
    username: ${DB_USERNAME:deutschpfad}
    password: ${DB_PASSWORD:deutschpfad}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  mail-from: ${MAIL_FROM:no-reply@deutschpfad.local}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  deepgram-api-key: ${DEEPGRAM_API_KEY:}
  groq-api-key: ${GROQ_API_KEY:}
  gemini-api-key: ${GEMINI_API_KEY:}
  unsplash-api-key: ${UNSPLASH_API_KEY:}
  openrouter-api-key: ${OPENROUTER_API_KEY:}


