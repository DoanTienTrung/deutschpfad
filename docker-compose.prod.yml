services:
  backend:
    image: ghcr.io/doantientrung/deutschpfad-backend:latest
    container_name: deutschpfad-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS}
      MAIL_FROM: ${MAIL_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      UNSPLASH_API_KEY: ${UNSPLASH_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      COHERE_API_KEY: ${COHERE_API_KEY}
      TUTOR_CHUNK_SIZE: ${TUTOR_CHUNK_SIZE:-800}
      TUTOR_CHUNK_OVERLAP: ${TUTOR_CHUNK_OVERLAP:-100}
      TUTOR_TEMPERATURE: ${TUTOR_TEMPERATURE:-0.4}
      TUTOR_MAX_OUTPUT_TOKENS: ${TUTOR_MAX_OUTPUT_TOKENS:-600}
      TUTOR_RAG_MAX_RESULTS: ${TUTOR_RAG_MAX_RESULTS:-5}
      TUTOR_RAG_MIN_SCORE: ${TUTOR_RAG_MIN_SCORE:-0.85}

      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      YTDLP_POT_BASE_URL: http://bgutil-provider:4416
      YTDLP_COOKIES_FILE: /app/cookies.txt
      YTDLP_BROWSER_PROFILE_DIR: /data/browser-profile
      YTDLP_HEALTHCHECK_ALERT_EMAIL: ${YTDLP_HEALTHCHECK_ALERT_EMAIL:-${MAIL_FROM}}
    ports:
      - "8080:8080"
    volumes:
      # Fallback static cookie export — kept as a secondary option (YtDlpService tries the
      # live browser profile below first) but proved too fragile as the primary mechanism:
      # Google rotates session cookies within hours, and a frozen snapshot can't follow that.
      - ./cookies.txt:/app/cookies.txt:ro
      # A persistent, logged-in Chromium profile that the browser-session service keeps alive
      # by periodically visiting youtube.com (see browser-session/keepalive.js) — its cookies
      # rotate the same way a real browser's would, so yt-dlp reads them live via
      # --cookies-from-browser instead of trusting a point-in-time export. Read-only: only
      # browser-session should ever write to the profile.
      - ./browser-profile:/data/browser-profile:ro
    depends_on:
      - bgutil-provider
      - browser-session

  # PO-token generator for yt-dlp — works around YouTube's "Sign in to confirm you're not a
  # bot" block on this EC2 IP. No ports published to the host: only the backend container
  # needs to reach it, over the internal compose network at bgutil-provider:4416.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: deutschpfad-bgutil-provider
    restart: unless-stopped

  # Keeps a logged-in Google/YouTube session "warm" in a persistent Chromium profile by
  # visiting youtube.com every ~30 minutes (see browser-session/keepalive.js) — this is what
  # lets the cookies self-refresh instead of going stale like the static cookies.txt export
  # did within hours. The profile itself is seeded once, offline, from a real browser session
  # (see README in browser-session/) — this service only keeps it alive, it never logs in.
  browser-session:
    build: ./browser-session
    container_name: deutschpfad-browser-session
    restart: unless-stopped
    volumes:
      - ./browser-profile:/data/profile
    shm_size: "1gb"

  frontend:
    image: ghcr.io/doantientrung/deutschpfad-frontend:latest
    container_name: deutschpfad-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot-webroot:/var/www/certbot:ro
      - ./certbot-etc:/etc/letsencrypt:ro
    depends_on:
      - backend
