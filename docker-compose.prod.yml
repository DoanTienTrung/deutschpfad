services:
  backend:
    image: ghcr.io/doantientrung/deutschpfad-backend:latest
    container_name: deutschpfad-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS}
      MAIL_FROM: ${MAIL_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      UNSPLASH_API_KEY: ${UNSPLASH_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      YTDLP_POT_BASE_URL: http://bgutil-provider:4416
      YTDLP_COOKIES_FILE: /app/cookies.txt
      YTDLP_HEALTHCHECK_ALERT_EMAIL: ${YTDLP_HEALTHCHECK_ALERT_EMAIL:-${MAIL_FROM}}
    ports:
      - "8080:8080"
    volumes:
      # Real Google session cookies (Netscape cookies.txt format) so yt-dlp passes YouTube's
      # bot check — not committed to git, lives only on the host. YtDlpHealthCheckService
      # emails an alert when this goes stale; re-export from a browser and overwrite in place
      # (no restart needed, the path is read fresh on every yt-dlp call).
      # Read-write (not :ro): yt-dlp rewrites the file with rotated cookie values after every
      # call, which is a free partial self-refresh — mounting read-only made it crash instead
      # (it tries to save on exit regardless of whether anything actually changed).
      - ./cookies.txt:/app/cookies.txt
    depends_on:
      - bgutil-provider

  # PO-token generator for yt-dlp — works around YouTube's "Sign in to confirm you're not a
  # bot" block on this EC2 IP. No ports published to the host: only the backend container
  # needs to reach it, over the internal compose network at bgutil-provider:4416.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: deutschpfad-bgutil-provider
    restart: unless-stopped

  frontend:
    image: ghcr.io/doantientrung/deutschpfad-frontend:latest
    container_name: deutschpfad-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot-webroot:/var/www/certbot:ro
      - ./certbot-etc:/etc/letsencrypt:ro
    depends_on:
      - backend
